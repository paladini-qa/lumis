name: Database Schema Migration

on:
  push:
    branches:
      - main

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run database migrations push
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "::error::The SUPABASE_DB_URL secret is empty or has not been configured in your GitHub Repository Secrets."
            echo "::error::Please go to Settings > Secrets and variables > Actions on GitHub and add a new repository secret named SUPABASE_DB_URL."
            exit 1
          fi
          supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"
